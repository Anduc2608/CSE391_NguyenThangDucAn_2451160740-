<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>

    <!-- CSS -->
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">
            MyShop
        </div>

        <!-- Menu -->
        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </nav>

        <!-- Auth Buttons -->
        <div class="auth-buttons">
            <button class="btn login-btn">Login</button>
            <button class="btn register-btn">Register</button>
        </div>

    </header>

    <!-- ================= PRODUCTS ================= -->

    <main class="products-container">

        <!-- Card 1 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?1" alt="product">
            <div class="card-content">
                <h3>Gaming Laptop</h3>
                <p class="price">$1200</p>
                <button>Mua</button>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?2" alt="product">
            <div class="card-content">
                <h3>Wireless Headphone</h3>
                <p class="price">$150</p>
                <button>Mua</button>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?3" alt="product">
            <div class="card-content">
                <h3>Mechanical Keyboard</h3>
                <p class="price">$90</p>
                <button>Mua</button>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?4" alt="product">
            <div class="card-content">
                <h3>Gaming Mouse</h3>
                <p class="price">$60</p>
                <button>Mua</button>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?5" alt="product">
            <div class="card-content">
                <h3>Smart Watch</h3>
                <p class="price">$240</p>
                <button>Mua</button>
            </div>
        </div>

        <!-- Card 6 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?6" alt="product">
            <div class="card-content">
                <h3>Bluetooth Speaker</h3>
                <p class="price">$75</p>
                <button>Mua</button>
            </div>
        </div>

        <!-- Card 7 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?7" alt="product">
            <div class="card-content">
                <h3>4K Monitor</h3>
                <p class="price">$400</p>
                <button>Mua</button>
            </div>
        </div>

        <!-- Card 8 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?8" alt="product">
            <div class="card-content">
                <h3>Webcam HD</h3>
                <p class="price">$110</p>
                <button>Mua</button>
            </div>
        </div>

    </main>

</body>
</html>
