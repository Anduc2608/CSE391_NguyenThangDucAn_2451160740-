<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Data Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>📊 Tổng Hợp Dữ Liệu Toàn Cầu</h1>
                <p id="fetchTime" class="timer-text">Nhấp "Cập nhật" để tải dữ liệu...</p>
            </div>
            <button id="refreshBtn" class="btn-refresh">🔄 Cập Nhật Hệ Thống</button>
        </header>

        <main class="dashboard-grid">
            
            <section class="widget-card" id="widget-0">
                <div class="widget-header">🌤️ Thời Tiết Hiện Tại (Hà Nội)</div>
                <div class="widget-body"></div>
            </section>

            <section class="widget-card" id="widget-1">
                <div class="widget-header">👤 Nhân Viên Xuất Sắc</div>
                <div class="widget-body"></div>
            </section>

            <section class="widget-card" id="widget-2">
                <div class="widget-header">📝 Bản Tin Công Nghệ</div>
                <div class="widget-body"></div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
